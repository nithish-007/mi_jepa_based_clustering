# RP2K dataset configuration
data:
  meta_csv: "dataset/meta_100.csv"
  class_mapping: "dataset/class_mapping.csv"
  train_dir: "dataset/rp2k_dataset/train"

  # Subset selection
  num_classes: 100
  min_images_per_class: 20

  # Image
  img_size: 224

  # Splits (all from train dir: 70/15/15)
  train_split: "train"
  val_split: "val"
  test_split: "test"
  train_ratio: 0.70
  val_ratio: 0.15
