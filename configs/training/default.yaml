# MI-JEPA training configuration
training:
  # Optimization
  lr: 1.5e-4
  weight_decay: 0.05
  warmup_epochs: 10
  max_epochs: 100

  # Batch & precision
  batch_size: 32
  accumulate_grad_batches: 1
  precision: "16-mixed"
  gradient_clip_val: 1.0

  # EMA
  base_momentum: 0.996

  # Bag construction
  bag_size: 4
  mask_ratio: 0.5

  # Loss weights
  lambda_jepa: 1.0
  lambda_energy: 0.0   # Phase 1: 0.0, Phase 2: 0.5
  lambda_reg: 0.1

  # Energy margins (Phase 2)
  energy_margin_low: 0.5
  energy_margin_high: 2.0

  # Misc
  seed: 42
  num_workers: 4
  save_every: 20
