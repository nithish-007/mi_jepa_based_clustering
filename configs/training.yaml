# Model + Training configuration
data:
  meta_csv: "dataset/meta_100.csv"
  img_size: 224
  bag_size: 4
  batch_size: 32
  num_workers: 4

model:
  name: "vit_small_patch16_224"
  embed_dim: 384
  pretrained: true
  mask_ratio: 0.5
  cia_layers: 2
  cia_heads: 6
  pred_layers: 2

training:
  max_epochs: 100
  lr: 1.5e-4
  weight_decay: 0.05
  warmup_epochs: 10
  base_momentum: 0.996
  fp16: true
  accum_grad: 1
  gradient_clip_val: 1.0
  seed: 42

loss:
  lambda_jepa: 1.0
  lambda_energy: 0.0     # Phase 1: 0.0, Phase 2: 0.5
  lambda_reg: 0.1
  energy_margin_low: 0.5
  energy_margin_high: 2.0

early_stopping:
  enabled: true
  monitor: "val/loss"
  patience: 15
  mode: "min"

checkpoint:
  dirpath: "checkpoints/mi_jepa"
  save_top_k: 3
  monitor: "val/loss"
  mode: "min"
  save_every: 20

mlflow:
  experiment_name: "mi-jepa"
  run_name: "mi-jepa-phase1"
  tracking_uri: "mlruns"   # local directory
