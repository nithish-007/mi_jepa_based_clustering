# Evaluation configuration for Track B (MI-JEPA on RPC)
data:
  manifest_csv: "dataset/rpc_crops_manifest.csv"
  split: "test"               # test2019 - 24k checkout images, 294k bbox crops
  samples_per_class: 30       # 200 cats * 30 = 6000 crops for K-Means
  img_size: 224
  batch_size: 128
  num_workers: 4

model:
  checkpoint: null            # set to the Track B .ckpt after training
  name: "vit_small_patch16_224"
  embed_dim: 384

output:
  output_dir: "results/eval_track_b"
  run_name: "track_b_rpc"

visualization:
  plot_tsne: true
